# AI 音乐 MV 独立子模块。
# 默认关闭，关闭时不会注册接口、访问独立 D1 或启动任何后台任务。
# 这里严禁复用 cloudflare.d1.database-id 和 cloudflare.r2.bucket。
music-mv:
  enabled: ${MUSIC_MV_ENABLED:false}
  public-base-url: ${MUSIC_MV_PUBLIC_BASE_URL:}
  d1:
    enabled: ${MUSIC_MV_D1_ENABLED:false}
    base-url: ${MUSIC_MV_CLOUDFLARE_API_BASE_URL:https://api.cloudflare.com/client/v4}
    account-id: ${MUSIC_MV_CLOUDFLARE_ACCOUNT_ID:}
    database-id: ${MUSIC_MV_CLOUDFLARE_D1_DATABASE_ID:}
    api-token: ${MUSIC_MV_CLOUDFLARE_D1_API_TOKEN:${MUSIC_MV_CLOUDFLARE_API_TOKEN:}}
  r2:
    account-id: ${MUSIC_MV_CLOUDFLARE_R2_ACCOUNT_ID:${MUSIC_MV_CLOUDFLARE_ACCOUNT_ID:}}
    bucket: ${MUSIC_MV_CLOUDFLARE_R2_BUCKET:${MUSIC_MV_R2_BUCKET:}}
    access-key-id: ${MUSIC_MV_CLOUDFLARE_R2_ACCESS_KEY_ID:${MUSIC_MV_R2_ACCESS_KEY_ID:}}
    secret-access-key: ${MUSIC_MV_CLOUDFLARE_R2_SECRET_ACCESS_KEY:${MUSIC_MV_R2_SECRET_ACCESS_KEY:}}
    public-base-url: ${MUSIC_MV_CLOUDFLARE_R2_PUBLIC_BASE_URL:}
  render:
    require-cloud-input-assets: ${MUSIC_MV_REQUIRE_CLOUD_INPUT_ASSETS:true}
    allow-loopback-http: ${MUSIC_MV_ALLOW_LOOPBACK_HTTP:false}
    default-max-attempts: ${MUSIC_MV_MAX_ATTEMPTS:2}
    max-output-bytes: ${MUSIC_MV_MAX_OUTPUT_BYTES:2147483648}
    local-storage-dir: ${MUSIC_MV_LOCAL_STORAGE_DIR:storage/music-mv-render}
    # Local debugging keeps browser-rendered MP4 files on this machine. Production must set this to r2.
    browser-output-storage: ${MUSIC_MV_BROWSER_OUTPUT_STORAGE:local}
  security:
    client-token: ${MUSIC_MV_CLIENT_TOKEN:}
    renderer-token: ${MUSIC_MV_RENDERER_TOKEN:}
    template-sync-token: ${MUSIC_MV_TEMPLATE_SYNC_TOKEN:} 
  auth:
    session-days: ${MUSIC_MV_AUTH_SESSION_DAYS:30}
    google:
      client-id: ${MUSIC_MV_GOOGLE_CLIENT_ID:}
      jwks-url: ${MUSIC_MV_GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}
    apple:
      client-id: ${MUSIC_MV_APPLE_CLIENT_ID:}
      redirect-uri: ${MUSIC_MV_APPLE_REDIRECT_URI:}
      jwks-url: ${MUSIC_MV_APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}
  media:
    cloudflare-api-base-url: ${MUSIC_MV_CLOUDFLARE_MEDIA_API_BASE_URL:https://api.cloudflare.com/client/v4}
    images:
      account-id: ${MUSIC_MV_CLOUDFLARE_IMAGES_ACCOUNT_ID:${MUSIC_MV_CLOUDFLARE_ACCOUNT_ID:}}
      api-token: ${MUSIC_MV_CLOUDFLARE_IMAGES_API_TOKEN:${MUSIC_MV_CLOUDFLARE_API_TOKEN:}}
      delivery-base-url: ${MUSIC_MV_CLOUDFLARE_IMAGES_DELIVERY_BASE_URL:${MUSIC_MV_IMAGES_DELIVERY_URL:}}
    stream:
      account-id: ${MUSIC_MV_CLOUDFLARE_STREAM_ACCOUNT_ID:${MUSIC_MV_CLOUDFLARE_ACCOUNT_ID:}}
      api-token: ${MUSIC_MV_CLOUDFLARE_STREAM_API_TOKEN:${MUSIC_MV_CLOUDFLARE_API_TOKEN:}}
      delivery-base-url: ${MUSIC_MV_CLOUDFLARE_STREAM_DELIVERY_BASE_URL:${MUSIC_MV_STREAM_DELIVERY_URL:}}
  ai-music:
    provider: ${MUSIC_MV_AI_PROVIDER:sunoapi}
    task-token-secret: ${MUSIC_MV_AI_TASK_TOKEN_SECRET:${MUSIC_MV_SUNOAPI_CALLBACK_TOKEN_SECRET:${MUSIC_MV_SUNOAPI_API_KEY:}}}
    # Server-side status reconciliation. It only queries already submitted provider task ids;
    # browser polling can pause without leaving a song permanently stuck in "generating".
    status-sync:
      enabled: ${MUSIC_MV_AI_STATUS_SYNC_ENABLED:true}
      interval-ms: ${MUSIC_MV_AI_STATUS_SYNC_INTERVAL_MS:5000}
      initial-delay-ms: ${MUSIC_MV_AI_STATUS_SYNC_INITIAL_DELAY_MS:5000}
      stale-after-seconds: ${MUSIC_MV_AI_STATUS_SYNC_STALE_AFTER_SECONDS:8}
      batch-size: ${MUSIC_MV_AI_STATUS_SYNC_BATCH_SIZE:20}
    sunoapi:
      enabled: ${MUSIC_MV_SUNOAPI_ENABLED:true}
      base-url: ${MUSIC_MV_SUNOAPI_BASE_URL:https://api.sunoapi.org}
      api-key: ${MUSIC_MV_SUNOAPI_API_KEY:}
      callback-token-secret: ${MUSIC_MV_SUNOAPI_CALLBACK_TOKEN_SECRET:${MUSIC_MV_SUNOAPI_API_KEY:}}
      model: ${MUSIC_MV_SUNOAPI_MODEL:V5_5}
    kie:
      enabled: ${MUSIC_MV_KIE_ENABLED:true}
      base-url: ${MUSIC_MV_KIE_BASE_URL:https://api.kie.ai}
      api-key: ${MUSIC_MV_KIE_API_KEY:}
      webhook-hmac-key: ${MUSIC_MV_KIE_WEBHOOK_HMAC_KEY:}
      model: ${MUSIC_MV_KIE_MODEL:V5_5}
      webhook-max-age-seconds: ${MUSIC_MV_KIE_WEBHOOK_MAX_AGE_SECONDS:300}
