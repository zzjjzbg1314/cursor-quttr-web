server:
  port: 443
  http:
    port: 8080
  ssl:
    enabled: true
    key-store: classpath:kejiapi.cn.jks
    key-store-password: ${SSL_KEY_STORE_PASSWORD:ussis711}
    key-store-type: JKS
    key-alias: ${SSL_KEY_ALIAS:kejiapi.cn}

spring:
  application:
    name: cursor-quitter-web

  # 数据库配置 - Cloudflare D1
  # 已禁用 JPA，只使用 Cloudflare D1 HTTP API
  # 所有数据库操作通过 CloudflareD1Util 工具类完成

  # Flyway数据库迁移配置
  flyway:
    enabled: ${FLYWAY_ENABLED:false}  # D1 迁移建议使用 wrangler d1 execute
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql

  # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=12h

# 微信配置
wechat:
  app-id: ${WECHAT_APP_ID:your_wechat_app_id_here}
  app-secret: ${WECHAT_APP_SECRET:your_wechat_app_secret_here}
  code2-session-url: https://api.weixin.qq.com/sns/jscode2session
  user-info-url: https://api.weixin.qq.com/sns/userinfo

# Apple 登录配置
apple:
  # Apple App ID / Client ID（例如：com.yourcompany.yourapp）
  client-id: ${APPLE_CLIENT_ID:}

# Google 登录配置
google:
  # Google Client ID（OAuth 2.0 客户端ID）
  client-id: ${GOOGLE_CLIENT_ID:553159841542-ias7p4c8ki8bppej616g3tuof42nc6nn.apps.googleusercontent.com}

# 阿里云OSS配置
aliyun_oss:
  endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
  access_key_id: ${ALIYUN_OSS_ACCESS_KEY:}
  access_key_secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  bucket_name: ${ALIYUN_OSS_BUCKET_NAME:my-avatar-images}
  # 视频文件目录前缀
  video_prefix: ${ALIYUN_OSS_VIDEO_PREFIX:library/}
  # 头像文件目录前缀
  avatar_prefix: ${ALIYUN_OSS_AVATAR_PREFIX:avatars/}
  # 签名URL过期时间（秒）
  url_expiration: ${ALIYUN_OSS_URL_EXPIRATION:3600}

# 阿里云号码认证服务配置（一键登录）
aliyun_dypnsapi:
  access_key_id: ${ALIYUN_DYPNSAPI_ACCESS_KEY_ID:}
  access_key_secret: ${ALIYUN_DYPNSAPI_ACCESS_KEY_SECRET:}
  region_id: ${ALIYUN_DYPNSAPI_REGION_ID:cn-hangzhou}
  # endpoint 只需要域名，不需要协议前缀（SDK会自动添加https://）
  endpoint: ${ALIYUN_DYPNSAPI_ENDPOINT:dypnsapi.aliyuncs.com}

# MQTT配置 - 阿里云MQ4IoT（完全按照官方示例）
mqtt:
  # 阿里云MQ4IoT实例信息
  instance:
    id: ${MQTT_INSTANCE_ID:}
  # 接入点地址
  endpoint: ${MQTT_ENDPOINT:}
  # 阿里云AccessKey认证 - 必须通过环境变量设置
  access-key: ${MQTT_ACCESS_KEY:}
  secret-key: ${MQTT_SECRET_KEY:}
  # MQ4IoT客户端配置
  group:
    id: ${MQTT_GROUP_ID:}
  device:
    id: ${MQTT_DEVICE_ID:}
  # 主题配置
  parent:
    topic: ${MQTT_PARENT_TOPIC:}
  # QoS配置
  qos:
    level: ${MQTT_QOS_LEVEL:0}
  # 连接配置 - 使用SSL连接（推荐）或TCP连接
  port:
    ssl: ${MQTT_SSL_PORT:8883}
    tcp: ${MQTT_TCP_PORT:1883}
  # 连接选项
  connection:
    # 使用SSL连接（推荐）
    use-ssl: ${MQTT_USE_SSL:true}
    # 连接超时时间（秒）
    timeout: ${MQTT_CONNECTION_TIMEOUT:30}
    # 保持连接间隔（秒）
    keep-alive: ${MQTT_KEEP_ALIVE:120}
    # 自动重连
    auto-reconnect: ${MQTT_AUTO_RECONNECT:true}
    # 重连延迟（毫秒）
    reconnect-delay: ${MQTT_RECONNECT_DELAY:5000}
    # 最大重连次数
    max-reconnect-attempts: ${MQTT_MAX_RECONNECT_ATTEMPTS:10}



# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    com.example.cursorquitterweb: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
    loggers:
      enabled: true

